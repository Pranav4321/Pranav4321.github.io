<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Woodshop · Pranav Sristy</title>
  <meta name="description" content="Woodworking projects by Pranav Sristy." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=Geist:wght@400..600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=28" />
</head>
<body class="inner">
  <header class="site-header">
    <div class="wrap">
      <a class="name" href="index.html">Pranav Sristy</a>
      <nav><a href="experience.html">Experience</a><a href="projects.html">Projects</a><a href="woodworking.html" class="active">Woodshop</a></nav>
    </div>
  </header>

  <main><div class="wrap">
    <div class="page-head">
      <h1 class="fade">Woodshop</h1>
      <p class="fade" style="animation-delay:.1s">Furniture and small objects, made by hand, from recycled wood.</p>
    </div>

    <!-- Each chip's data-filter must match the data-cat on the pieces below -->
    <div class="filters reveal">
      <button class="chip on" data-filter="all">All</button>
      <button class="chip" data-filter="furniture">Furniture</button>
      <button class="chip" data-filter="boxes">Boxes</button>
      <button class="chip" data-filter="turning">Turning</button>
      <button class="chip" data-filter="small">Small builds</button>
    </div>

    <!-- To add a piece, copy a <button class="piece"> block and edit its data-* fields.
         To add a photo, put it in images/woodworking/ and replace the placeholder with the <img>. -->
    <div class="gallery">
      <button class="piece reveal" data-cat="furniture" data-title="Plant Stand" data-wood="Reclaimed wood" data-finish="Stain + clear coat" data-time="~23 hours" data-note="Three open box frames at stepped heights, joined into one stand so plants can sit at different levels in a window. Built from reclaimed wood, then sanded, stained and finished.">
        <div class="img tall"><img src="images/woodworking/plant-stand.jpg" alt="A stepped wooden plant stand of open box frames in front of a bay window, holding two potted plants" loading="lazy"></div>
        <div class="info"><h3>Plant Stand</h3><span class="meta"></span></div>
      </button>
      <button class="piece reveal soon" data-cat="boxes" data-title="Coming soon" data-note="In the shop now. Photos once it's done.">
        <div class="img tall"><div class="ph">coming soon</div></div>
        <div class="info"><h3>Coming soon</h3><span class="meta"></span></div>
      </button>
      <button class="piece reveal soon" data-cat="turning" data-title="Coming soon" data-note="In the shop now. Photos once it's done.">
        <div class="img square"><div class="ph">coming soon</div></div>
        <div class="info"><h3>Coming soon</h3><span class="meta"></span></div>
      </button>
      <button class="piece reveal" data-cat="small" data-title="End-Grain Cutting Board" data-wood="Reclaimed hardwood" data-finish="Stain + food-safe finish" data-time="~14 hours" data-note="A thick end-grain butcher block, glued up from strips, crosscut and re-glued so the end grain faces up. It's easier on knife edges and hides cut marks. Sanded, stained and finished.">
        <div class="img tall"><img src="images/woodworking/cutting-board.jpg" alt="A thick end-grain cutting board on a dining table in warm window light" loading="lazy"></div>
        <div class="info"><h3>End-Grain Cutting Board</h3><span class="meta"></span></div>
      </button>
      <button class="piece reveal" data-cat="furniture" data-title="Peetas" data-wood="Reclaimed wood" data-finish="Stain + clear coat" data-time="~12 hours" data-note="A pair of peetas, the low wooden seats used in Indian homes, with traditional white patterns along the edges. Built from reclaimed wood, then sanded, stained and finished.">
        <div class="img wide-img"><img src="images/woodworking/peetas.jpg" alt="Two low wooden peetas with white patterned borders on a hardwood floor" loading="lazy"></div>
        <div class="info"><h3>Peetas</h3><span class="meta"></span></div>
      </button>
      <button class="piece reveal soon" data-cat="turning" data-title="Coming soon" data-note="In the shop now. Photos once it's done.">
        <div class="img wide-img"><div class="ph">coming soon</div></div>
        <div class="info"><h3>Coming soon</h3><span class="meta"></span></div>
      </button>
    </div>
  </div></main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lb-inner" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
      <div class="lb-media" id="lbMedia"></div>
      <div class="lb-body">
        <span class="meta" id="lbYear"></span>
        <h2 id="lbTitle"></h2>
        <p id="lbNote"></p>
        <div class="specs">
          <div><span class="meta">Wood</span><span id="lbWood"></span></div>
          <div><span class="meta">Finish</span><span id="lbFinish"></span></div>
          <div><span class="meta">Build time</span><span id="lbTime"></span></div>
        </div>
        <div class="lb-nav"><button class="lb-btn" id="lbPrev" aria-label="Previous piece">←</button><button class="lb-btn" id="lbNext" aria-label="Next piece">→</button></div>
      </div>
      <button class="lb-btn lb-close" id="lbClose" aria-label="Close">✕</button>
    </div>
  </div>

  <footer class="site-footer">
    <div class="wrap">
      <span>© <span id="year">2026</span> Pranav Sristy</span>
      <span><a href="https://github.com/yourusername" target="_blank" rel="noopener">GitHub</a> · <a href="https://linkedin.com/in/yourusername" target="_blank" rel="noopener">LinkedIn</a> · <a href="resume.pdf" target="_blank">Résumé</a> · <a href="mailto:you@email.com">Email</a></span>
    </div>
  </footer>
  <script src="ribbon.js?v=17"></script>
  <script src="main.js?v=28"></script>
</body>
</html>
