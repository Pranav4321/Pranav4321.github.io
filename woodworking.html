<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Woodshop · Pranav Sristy</title>
  <meta name="description" content="Woodworking projects by Pranav Sristy." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Geist:wght@400..600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=14" />
</head>
<body class="inner">
  <header class="site-header">
    <div class="wrap">
      <a class="name" href="index.html">Pranav Sristy</a>
      <nav><a href="experience.html">Experience</a><a href="projects.html">Projects</a><a href="woodworking.html" class="active">Woodshop</a></nav>
    </div>
  </header>

  <main><div class="wrap">
    <div class="page-head">
      <h1 class="fade">Woodshop</h1>
      <p class="fade" style="animation-delay:.1s">Furniture and small objects, made by hand. Tap any piece for the details.</p>
    </div>

    <!-- Each chip's data-filter must match the data-cat on the pieces below -->
    <div class="filters reveal">
      <button class="chip on" data-filter="all">All</button>
      <button class="chip" data-filter="furniture">Furniture</button>
      <button class="chip" data-filter="boxes">Boxes</button>
      <button class="chip" data-filter="turning">Turning</button>
      <button class="chip" data-filter="small">Small builds</button>
    </div>

    <!-- To add a piece, copy a <button class="piece"> block and edit its data-* fields.
         To add a photo, put it in images/woodworking/ and replace the placeholder with the <img>. -->
    <div class="gallery">
      <button class="piece reveal" data-cat="furniture" data-title="Walnut Coffee Table" data-wood="Black walnut" data-finish="Hardwax oil" data-time="~40 hours" data-year="2026" data-note="Breadboard ends and a floating shelf. My first time doing drawbore mortise-and-tenon joints.">
        <div class="img wide-img"><div class="ph">photo</div><!-- <img src="images/woodworking/your-photo.jpg" alt="Walnut Coffee Table"> --></div>
        <div class="info"><h3>Walnut Coffee Table</h3><span class="meta">2026</span></div>
      </button>
      <button class="piece reveal" data-cat="boxes" data-title="Dovetailed Keepsake Box" data-wood="Cherry &amp; maple" data-finish="Shellac" data-time="~12 hours" data-year="2025" data-note="Hand-cut through dovetails with a contrasting maple lid.">
        <div class="img tall"><div class="ph">photo</div><!-- <img src="images/woodworking/your-photo.jpg" alt="Dovetailed Keepsake Box"> --></div>
        <div class="info"><h3>Dovetailed Keepsake Box</h3><span class="meta">2025</span></div>
      </button>
      <button class="piece reveal" data-cat="turning" data-title="Spalted Maple Bowl" data-wood="Spalted maple" data-finish="Food-safe oil" data-time="~4 hours" data-year="2025" data-note="Turned green, dried for two months, then finish-turned.">
        <div class="img square"><div class="ph">photo</div><!-- <img src="images/woodworking/your-photo.jpg" alt="Spalted Maple Bowl"> --></div>
        <div class="info"><h3>Spalted Maple Bowl</h3><span class="meta">2025</span></div>
      </button>
      <button class="piece reveal" data-cat="small" data-title="End-Grain Cutting Board" data-wood="Maple, walnut, cherry" data-finish="Mineral oil &amp; beeswax" data-time="~6 hours" data-year="2024" data-note="Checkerboard end-grain pattern. Made a batch of these as gifts.">
        <div class="img square"><div class="ph">photo</div><!-- <img src="images/woodworking/your-photo.jpg" alt="End-Grain Cutting Board"> --></div>
        <div class="info"><h3>End-Grain Cutting Board</h3><span class="meta">2024</span></div>
      </button>
      <button class="piece reveal" data-cat="furniture" data-title="Oak Bookshelf" data-wood="White oak" data-finish="Water-based poly" data-time="~25 hours" data-year="2024" data-note="Dados for the shelves and a fitted back panel.">
        <div class="img tall"><div class="ph">photo</div><!-- <img src="images/woodworking/your-photo.jpg" alt="Oak Bookshelf"> --></div>
        <div class="info"><h3>Oak Bookshelf</h3><span class="meta">2024</span></div>
      </button>
      <button class="piece reveal" data-cat="turning" data-title="Pen Set" data-wood="Assorted hardwoods" data-finish="CA glue" data-time="~1 hour each" data-year="2024" data-note="Quick lathe projects from offcuts.">
        <div class="img wide-img"><div class="ph">photo</div><!-- <img src="images/woodworking/your-photo.jpg" alt="Pen Set"> --></div>
        <div class="info"><h3>Pen Set</h3><span class="meta">2024</span></div>
      </button>
    </div>
  </div></main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lb-inner" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
      <div class="lb-media" id="lbMedia"></div>
      <div class="lb-body">
        <span class="meta" id="lbYear"></span>
        <h2 id="lbTitle"></h2>
        <p id="lbNote"></p>
        <div class="specs">
          <div><span class="meta">Wood</span><span id="lbWood"></span></div>
          <div><span class="meta">Finish</span><span id="lbFinish"></span></div>
          <div><span class="meta">Build time</span><span id="lbTime"></span></div>
        </div>
        <div class="lb-nav"><button class="lb-btn" id="lbPrev" aria-label="Previous piece">←</button><button class="lb-btn" id="lbNext" aria-label="Next piece">→</button></div>
      </div>
      <button class="lb-btn lb-close" id="lbClose" aria-label="Close">✕</button>
    </div>
  </div>

  <footer class="site-footer">
    <div class="wrap">
      <span>© <span id="year">2026</span> Pranav Sristy</span>
      <span><a href="https://github.com/yourusername" target="_blank" rel="noopener">GitHub</a> · <a href="https://linkedin.com/in/yourusername" target="_blank" rel="noopener">LinkedIn</a> · <a href="resume.pdf" target="_blank">Résumé</a> · <a href="mailto:you@email.com">Email</a></span>
    </div>
  </footer>
  <script src="main.js?v=14"></script>
</body>
</html>
